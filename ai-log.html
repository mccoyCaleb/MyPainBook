<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>AI Log</title>
  <script>if (localStorage.getItem('site-theme') === 'dark') document.documentElement.classList.add('dark-mode');</script>
  <link rel="stylesheet" href="./css/styles.css">
</head>
<body class="entry-page">
<div class="sidebar-shell" data-sidebar>
  <nav class="sidebar-nav" aria-label="Main navigation">
    <h2>Menu</h2>
    <a href="./index.html">home</a>
    <a href="./about.html">about</a>
    <a href="./ai-log.html" class="active" aria-current="page">ai-log</a>
    <a href="./journal.html">journal</a>
    <a href="./projects.html">projects</a>
    <button class="sidebar-toggle" data-sidebar-toggle type="button" aria-label="Open navigation" aria-expanded="false">☰</button>
  </nav>
</div>

<div class="page-content">
  <div class="header">
    <h1>Caleb McCoys website</h1>
  </div>
  <div class="settings-shell" data-settings>
    <button class="settings-toggle" data-settings-toggle type="button" aria-label="Open settings" aria-expanded="false">⚙</button>
    <aside class="settings-panel" aria-label="Settings">
      <h2>Settings</h2>
      <label class="settings-option"><span>Dark mode</span><input type="checkbox" data-theme-toggle></label>
      <label class="settings-option settings-range"><span>Font size <output data-font-size-value>100%</output></span><input type="range" data-font-size min="80" max="130" value="100" step="5"></label>
      <label class="settings-option"><span>ADHD mode</span><input type="checkbox" data-adhd-toggle></label>
    </aside>
  </div>
  <div class="adhd-gif-shell" data-adhd-gif><img class="adhd-gif" src="./images/10 Minutes Minecraft Parkour Gameplay [Free to Use] [Download] - GianLeco (1080p, h264, youtube).gif" alt="Minecraft parkour gameplay for ADHD mode"></div>

<div id="entries"></div>
<div id="modal"><div class="card"><div class="header"><h2 id="title"></h2><button class="close" id="close">×</button></div><div class="body"><div class="content" id="content"></div></div></div></div>
</div>
<script src="./js/script.js"></script>
<script>
const entries=document.getElementById('entries');
const modal=document.getElementById('modal');
const title=document.getElementById('title');
const content=document.getElementById('content');
const body=document.querySelector('.body');
const close=document.getElementById('close');
const aiBase='./Ai-entrees/';
const cacheBuster=Date.now();
function cacheUrl(url){
  try {
    const resolved=new URL(url, window.location.href);
    if(resolved.protocol === 'file:') return url;
  } catch (err) {
    // if URL resolve fails, fallback to original URL
  }
  return url + (url.includes('?') ? '&' : '?') + 'v=' + cacheBuster;
}
function getDescription(text){
  const match=text.match(/<description>([\s\S]*?)<\/description>/i);
  const desc=match ? match[1].trim() : '';
  console.log('AI getDescription:', desc ? 'found' : 'none', desc);
  return desc;
}
function renderText(text,fileUrl){
  console.log('AI renderText start', {fileUrl, length:text.length});
  const cleaned=text.replace(/<description[^>]*>[\s\S]*?<\/description>/gi,'').trim();
  console.log('AI renderText cleaned startsWith', cleaned.slice(0,120));
  const template=document.createElement('template');
  template.innerHTML=cleaned;
  template.content.querySelectorAll('img').forEach(img=>{
    const src=img.getAttribute('src');
    if(src) img.setAttribute('src', new URL(src, fileUrl).href);
  });
  template.content.querySelectorAll('description').forEach(el=>el.remove());
  function preserveNewlines(node){
    node.childNodes.forEach(child=>{
      if(child.nodeType===Node.TEXT_NODE && child.nodeValue.includes('\n')){
        const parts=child.nodeValue.split('\n');
        const frag=document.createDocumentFragment();
        parts.forEach((part,index)=>{
          frag.appendChild(document.createTextNode(part));
          if(index<parts.length-1) frag.appendChild(document.createElement('br'));
        });
        child.replaceWith(frag);
      } else if(child.nodeType===Node.ELEMENT_NODE || child.nodeType===Node.DOCUMENT_FRAGMENT_NODE){
        preserveNewlines(child);
      }
    });
  }
  preserveNewlines(template.content);
  return document.importNode(template.content, true);
}
function showItems(list){
  entries.innerHTML='';
  list.forEach(item=>{
    const btn=document.createElement('button');
    btn.className='entry';
    btn.innerHTML=`<h2>${item.name}</h2><p>${item.description||''}</p>`;
    const p=btn.querySelector('p');
    const fileUrl=item.file.startsWith('./')||item.file.startsWith('../') ? item.file : aiBase+item.file;
    const mode=item.mode||'text';
    btn.onclick=()=>{
      console.log('AI button click', {name:item.name, fileUrl, mode});
      if(mode==='html'){
        window.location.href=fileUrl;
        return;
      }
      fetchEntryText(item).then(text=>{
        const descText=getDescription(text);
        if(descText) p.textContent=descText;
        title.textContent=item.name;
        const absoluteUrl=new URL(fileUrl, window.location.href).href;
        const fragment=renderText(text, absoluteUrl);
        body.classList.toggle('is-scrollable', text.length > 500);
        content.innerHTML='';
        content.appendChild(fragment);
        modal.classList.add('show');
      }).catch(err=>{
        console.error(err);
        body.classList.remove('is-scrollable');
        title.textContent=item.name;
        if(window.location.protocol === 'file:'){
          content.innerHTML='<div style="color:#900;font-weight:700;line-height:1.5;">Local file access is blocked by browser security. Start a local HTTP server and open this page with <code>http://localhost:8000/</code>.</div>';
        } else {
          content.innerHTML='<object data="'+fileUrl+'" type="text/html"></object>';
        }
        modal.classList.add('show');
      });
    };
    entries.appendChild(btn);
  });
}
function fetchEntryText(item){
  const fileUrl=item.file.startsWith('./')||item.file.startsWith('../') ? item.file : aiBase+item.file;
  if(window.location.protocol === 'file:'){
    return Promise.reject(new Error('Local browser security blocks file:// text reads. Run this page through a local HTTP server to enable AI entry parsing.'));
  }
  return fetch(cacheUrl(fileUrl), {cache:'reload'}).then(response=>{
    if(!response.ok) throw new Error(response.status+' '+response.statusText);
    return response.text();
  });
}
if(window.AI_ENTRIES){
  showItems(window.AI_ENTRIES);
} else {
  const script=document.createElement('script');
  script.src=cacheUrl('./Ai-entrees/manifest.js');
  script.onload=()=>{ if(window.AI_ENTRIES) showItems(window.AI_ENTRIES); else entries.textContent='Could not load entries.'; };
  script.onerror=()=>{ entries.textContent='Could not load entries.'; };
  document.head.appendChild(script);
}
close.onclick=()=>modal.classList.remove('show');
modal.onclick=e=>{if(e.target===modal)modal.classList.remove('show')};
</script>
</body>
</html>
